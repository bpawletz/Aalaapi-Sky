name: Auto-Build index.html

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'tools/**'
      - 'index.css'
      - 'index_template.html'
      - 'scratch/build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    name: Compile index.html & Commit to Main
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Build Script
      run: python scratch/build.py

    - name: Commit and Push built index.html
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html .nojekyll
        # Commit and push only if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-compile index.html [skip ci]" && git pull --rebase origin main && git push)
