name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'index_template.html'
      - 'index.css'
      - 'scratch/build.py'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Provision Native ARM64 DJI Log Decryptor Binary
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -sSL https://github.com/lvauvillier/dji-log-parser/releases/download/v0.5.7/dji-log-aarch64-unknown-linux-musl.tar.gz -o /tmp/dji-log-arm64.tar.gz
          tar -xzf /tmp/dji-log-arm64.tar.gz -C /tmp
          python3 -c '
          with open("/tmp/dji-log", "rb") as f:
              data = f.read()
          old_url = b"https://dev.dji.com/openapi/v1/flight-records/keychains"
          new_url = b"http://127.0.0.1:18765/openapi/v1/flight-records/keycha"
          assert len(old_url) == len(new_url)
          assert old_url in data, "Target URL not found in dji-log binary"
          patched = data.replace(old_url, new_url)
          with open("android/app/src/main/jniLibs/arm64-v8a/libdjilog.so", "wb") as f:
              f.write(patched)
          '
          chmod +x android/app/src/main/jniLibs/arm64-v8a/libdjilog.so

      - name: Bundle Web Assets into Android Assets
        run: |
          python scratch/build.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          gradle assembleDebug --no-daemon --max-workers=2 --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AalaapiSky-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
